<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Love Pet</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
    }
    header {
      background-color: #FF6B6B;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #FFD93D;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .produto {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      background-color: #fff5e1;
    }
    .produto img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    footer {
      background-color: #FF6B6B;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nossos Produtos</h1>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="produtos.html">Produtos</a>
    <a href="contato.html">Contato</a>
  </nav>

  <section class="produtos">
    <div class="produto">
      <img src="https://i.imgur.com/9vKQw3n.jpg" alt="Ração para cães">
      <h3>Ração Premium Cães</h3>
      <p>Alimento balanceado para cães adultos.</p>
    </div>
    <div class="produto">
      <img src="https://i.imgur.com/7MWxTZH.jpg" alt="Ração para gatos">
      <h3>Ração Premium Gatos</h3>
      <p>Ração sabor salmão para gatos exigentes.</p>
    </div>
    <div class="produto">
      <img src="https://i.imgur.com/m8HnkqT.jpg" alt="Sachê para cães">
      <h3>Sachê Cães Adultos</h3>
      <p>Comida úmida deliciosa para seu pet.</p>
    </div>
    <div class="produto">
      <img src="https://i.imgur.com/ZpCdPnp.jpg" alt="Sachê para gatos">
      <h3>Sachê Gatos</h3>
      <p>Sachê sabor atum e frango.</p>
    </div>
  </section>

  <footer>
    &copy; 2025 Casa de Ração Love Pet
  </footer>
</body>
</html>
